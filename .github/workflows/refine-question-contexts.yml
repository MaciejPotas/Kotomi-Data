name: Apply question context audit

on:
  push:
    branches:
      - fix/generative-question-patterns
    paths:
      - .github/workflows/refine-question-contexts.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/generative-question-patterns

      - name: Apply audited question changes
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          maps_path = Path("patterns/sentence_maps.xml")
          maps = maps_path.read_text(encoding="utf-8")
          changes = (
              (
                  "<answer>{interrogative[id:doko]}で{verb[role:location][form]}{question}</answer>",
                  "<answer>{context.kana}{interrogative[id:doko]}で{verb[role:location][form]}{question}</answer>",
                  "place answer context",
              ),
              (
                  "<answer>{interrogative[id:doko]}へ{verb[role:destination][form]}{question}</answer>",
                  "<answer>{context.kana}{interrogative[id:doko]}へ{verb[role:destination][form]}{question}</answer>",
                  "destination answer context",
              ),
              (
                  "<answer>{interrogative[id:dare]}と{verb[role:companion][form]}{question}</answer>",
                  "<answer>{context.kana}{interrogative[id:dare]}と{verb[role:companion][form]}{question}</answer>",
                  "companion answer context",
              ),
              (
                  "<answer>{interrogative[id:nani]}を{verb[role:object][form]}{question}</answer>",
                  "<answer>{context.kana}{interrogative[id:nani]}を{verb[role:object][form]}{question}</answer>",
                  "object answer context",
              ),
              (
                  "<question>Dlaczego {pattern}?</question>\n      <answer>{interrogative[asks_for:reason]}{pattern}{question}</answer>",
                  "<question>Dlaczego {context.translation}{pattern}?</question>\n      <answer>{context.kana}{interrogative[asks_for:reason]}{pattern}{question}</answer>",
                  "reason context",
              ),
              (
                  "<question>W jaki sposób {pattern}?</question>\n      <answer>{interrogative[id:douyatte]}{pattern}{question}</answer>",
                  "<question>W jaki sposób {context.translation}{pattern}?</question>\n      <answer>{context.kana}{interrogative[id:douyatte]}{pattern}{question}</answer>",
                  "method context",
              ),
          )
          for old, new, label in changes:
              maps = replace_once(maps, old, new, label)
          maps_path.write_text(maps, encoding="utf-8", newline="\n")

          grammar_path = Path("grammar/grammar_rules.xml")
          grammar = grammar_path.read_text(encoding="utf-8")
          grammar = replace_once(
              grammar,
              '    <role id="object" label="Object" particle="を" />\n',
              '    <role id="object" label="Object" particle="を" />\n'
              '    <role id="route" label="Route / point of departure" particle="を" accepts="place" />\n',
              "route role",
          )
          grammar_path.write_text(grammar, encoding="utf-8", newline="\n")

          verbs_path = Path("dictionaries/verbs.xml")
          verbs = verbs_path.read_text(encoding="utf-8")
          for verb_id in ("deru", "tooru"):
              pattern = re.compile(
                  rf'(<word id="{verb_id}"[^>]*>[\s\S]*?<usage>\s*)'
                  rf'<role ref="object" accepts="place" />'
              )
              verbs, count = pattern.subn(r'\1<role ref="route" />', verbs, count=1)
              if count != 1:
                  raise RuntimeError(f"{verb_id}: expected one route-role replacement, found {count}")
          verbs_path.write_text(verbs, encoding="utf-8", newline="\n")

          revision_path = Path("content_revision.json")
          revision_path.write_text(
              json.dumps({"format": 1, "revision": 9}, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          def file_hash(path: Path) -> str:
              data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              return hashlib.sha256(data).hexdigest()

          manifest_path = Path("content_update_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["revision"] = 9
          for item in manifest["files"]:
              install_path = item["path"]
              relative = install_path.removeprefix("data/")
              source = Path(relative)
              digest = file_hash(source)
              item["sha256"] = digest
              remote = item["url"].split("?", 1)[0]
              item["url"] = f"{remote}?kotomi_sha256={digest}"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

      - name: Commit audited data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patterns/sentence_maps.xml grammar/grammar_rules.xml dictionaries/verbs.xml content_revision.json content_update_manifest.json
          git commit -m "Audit question contexts and Japanese role semantics"
          git push origin HEAD:fix/generative-question-patterns
