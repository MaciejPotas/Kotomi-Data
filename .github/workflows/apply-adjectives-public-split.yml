name: Publish split Adjectives package

on:
  pull_request:
    branches:
      - development/update-architecture
    paths:
      - tools/apply_adjectives_public_split.py
      - .github/workflows/apply-adjectives-public-split.yml

permissions:
  contents: write

concurrency:
  group: adjectives-public-split
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.ref == 'feature/adjectives-logic-separation' &&
      github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out exact public feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/adjectives-logic-separation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply guarded public Adjectives split
        run: python tools/apply_adjectives_public_split.py

      - name: Validate package and manifest
        shell: pwsh
        run: |
          python -m py_compile `
            quizzes/adjectives/Kotomi_adjectives.py `
            quizzes/adjectives/logic.py `
            quizzes/adjectives/mobile.py `
            quizzes/grammar/Kotomi_grammar.py `
            quizzes/grammar/logic.py `
            quizzes/grammar/mobile.py
          python -m json.tool quiz_update_manifest.json > $null

      - name: Stage exact public package scope
        shell: pwsh
        run: |
          Remove-Item tools/apply_adjectives_public_split.py
          git add -- `
            quiz_update_manifest.json `
            quizzes/adjectives/Kotomi_adjectives.py `
            quizzes/adjectives/logic.py `
            quizzes/adjectives/mobile.py `
            quizzes/grammar/Kotomi_grammar.py `
            quizzes/grammar/logic.py `
            quizzes/grammar/mobile.py `
            tools/apply_adjectives_public_split.py
          git diff --cached --check

      - name: Commit validated public packages
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish split Adjectives quiz package"
          git push origin HEAD:feature/adjectives-logic-separation
