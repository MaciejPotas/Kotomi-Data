name: Fresh start cleanup v2

on:
  push:
    branches:
      - refactor/public-data-ownership
    paths:
      - .github/workflows/fresh_start_cleanup_v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fresh-start public contract
        run: python tools/fresh_start_public_cleanup.py
      - name: Validate public contract
        shell: bash
        run: |
          python -m py_compile quizzes/*/*.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path, PurePosixPath
          root=Path.cwd()
          db=json.loads((root/'database_update_manifest.json').read_text(encoding='utf-8'))
          assert db['version']=='1.1.1'
          assert all(item['path'].startswith('data/') for item in db['files'])
          assert not any('shared/' in item['path'] for item in db['files'])
          assert len(db['files']) == len(list(root.glob('*.xml')))
          for item in db['files']:
              source=root/item['url'].split('?',1)[0]
              data=source.read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              assert hashlib.sha256(data).hexdigest()==item['sha256']
          quiz=json.loads((root/'quiz_update_manifest.json').read_text(encoding='utf-8'))
          for item in quiz['files']:
              install=PurePosixPath(item['path'])
              source=root.joinpath('quizzes',*install.parts[1:])
              data=source.read_bytes()
              if source.suffix.lower() in {'.py','.xml','.json','.md','.txt','.bat','.yml','.yaml'} or source.name=='LICENSE':
                  data=data.replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              assert hashlib.sha256(data).hexdigest()==item['sha256'], item['path']
          forbidden=(
              'shared/quiz_data',
              'REPOSITORY_SHARED_DIR',
              'from quiz_core import',
              'from quiz_engine import',
              'from mobile_ui import',
              'from shared.',
          )
          for path in root.glob('quizzes/*/*.py'):
              text=path.read_text(encoding='utf-8')
              for value in forbidden:
                  assert value not in text, (path, value)
          PY
          git diff --check
      - name: Commit fresh-start public contract
        shell: bash
        run: |
          rm -f .github/workflows/fresh_start_cleanup.yml
          rm -f .github/workflows/fresh_start_cleanup_v2.yml
          rm -f tools/fresh_start_public_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Drop legacy public compatibility paths"
          git push origin HEAD:refactor/public-data-ownership
