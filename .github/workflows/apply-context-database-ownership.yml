name: Apply context database ownership

on:
  push:
    branches:
      - fix/database-owns-grammar-metadata

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize grammar metadata ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          database_owned = {
              'data/grammar/grammar_rules.xml',
              'data/grammar/contexts.xml',
          }

          db_path = Path('database_update_manifest.json')
          db = json.loads(db_path.read_text(encoding='utf-8'))
          assert db['revision'] == 5
          db_paths = {item['path'] for item in db['files']}
          assert database_owned <= db_paths

          quiz_path = Path('quiz_update_manifest.json')
          quiz = json.loads(quiz_path.read_text(encoding='utf-8'))
          quiz['files'] = [
              item for item in quiz['files'] if item['path'] not in database_owned
          ]
          quiz_path.write_text(
              json.dumps(quiz, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          quiz_paths = {item['path'] for item in quiz['files']}
          assert database_owned.isdisjoint(quiz_paths)
          PY

      - name: Commit public manifest fix
        run: |
          rm .github/workflows/apply-context-database-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep grammar metadata in database channel"
          git push origin HEAD:fix/database-owns-grammar-metadata
