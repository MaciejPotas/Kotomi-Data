name: Publish PR 29 quiz logic

on:
  push:
    branches:
      - feature/pattern-name-as-id

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kotomi-Data
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Synchronize published quiz logic
        run: python tools/maintenance/publish_pattern_identity_quiz_logic_pr29.py

      - name: Validate Python syntax
        run: python -m compileall -q quizzes

      - name: Commit synchronized publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish readable pattern identity quiz logic"
            git push origin HEAD:feature/pattern-name-as-id
          fi
