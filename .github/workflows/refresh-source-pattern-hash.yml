name: Refresh source pattern manifest hash

on:
  push:
    branches: [test/content-update-role-source]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh hash and validate
        shell: bash
        run: |
          HASH=$(sha256sum patterns/sentence_maps.xml | cut -d' ' -f1)
          HASH="$HASH" python3 -c "import json, os; from pathlib import Path; p=Path('content_update_manifest.json'); d=json.loads(p.read_text(encoding='utf-8')); e=next(x for x in d['files'] if x['path']=='data/patterns/sentence_maps.xml'); h=os.environ['HASH']; e['sha256']=h; e['url']=f'patterns/sentence_maps.xml?kotomi_sha256={h}'; p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\\n', encoding='utf-8')"
          python3 tools/validate_repository.py
      - name: Commit clean branch state
        shell: bash
        run: |
          rm .github/workflows/refresh-source-pattern-hash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh source pattern manifest hash"
          git push origin HEAD:test/content-update-role-source
