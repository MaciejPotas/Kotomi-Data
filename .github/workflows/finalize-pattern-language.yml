name: Finalize pattern language data

on:
  push:
    branches: [pattern-language-v14]
    paths:
      - .github/workflows/finalize-pattern-language.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pattern-language-v14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Rebuild database update manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')

          def file_hash(path: Path) -> str:
              data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              return hashlib.sha256(data).hexdigest()

          xml_files = sorted(
              path for path in root.rglob('*.xml')
              if 'quizzes' not in path.parts
          )
          manifest = {
              'format': 1,
              'version': '1.1.1',
              'files': [
                  {
                      'path': f"data/{path.as_posix()}",
                      'sha256': digest,
                      'url': f"{path.as_posix()}?kotomi_sha256={digest}",
                  }
                  for path in xml_files
                  for digest in [file_hash(path)]
              ],
          }
          Path('database_update_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_update_manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current"
            exit 0
          fi
          git commit -m "Refresh database manifest for pattern language"
          git push origin HEAD:pattern-language-v14
