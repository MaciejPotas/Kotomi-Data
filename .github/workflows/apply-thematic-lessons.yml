name: Apply thematic lesson migration

on:
  push:
    branches:
      - feature/thematic-vocabulary-lessons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out lesson branch
        uses: actions/checkout@v6
        with:
          ref: feature/thematic-vocabulary-lessons

      - name: Move reusable vocabulary into dictionaries and rebuild thematic lessons
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          VERBS = Path('dictionaries/verbs.xml')
          LESSONS = Path('lessons/lessons.xml')
          MANIFEST = Path('database_update_manifest.json')
          REVISION = Path('database_revision.json')

          new_words = r'''
              <word id="ageru_give" translation="dawać komuś" kana="あげる" type="ichidan" ending="ru">
                <usage>
                  <role ref="object" accepts="food drink text media vehicle thing" nouns="okane" />
                  <role ref="target" accepts="person animal" />
                  <role ref="location" />
                </usage>
                <forms>
                  <form name="dictionary" translation="daję komuś" context="present" kana="あげる" />
                  <form name="polite_nonpast" translation="daję komuś" context="present" kana="あげます" />
                  <form name="plain_negative" translation="nie daję komuś" context="present" kana="あげない" />
                  <form name="polite_negative" translation="nie daję komuś" context="present" kana="あげません" />
                  <form name="past_plain" translation="dałem komuś" context="past" kana="あげた" />
                  <form name="past_polite" translation="dałem komuś" context="past" kana="あげました" />
                  <form name="past_negative_plain" translation="nie dałem komuś" context="past" kana="あげなかった" />
                  <form name="past_negative_polite" translation="nie dałem komuś" context="past" kana="あげませんでした" />
                  <form name="te_form" context="none" kana="あげて" />
                  <form name="potential" context="none" kana="あげられる" />
                  <form name="passive" context="none" kana="あげられる" />
                  <form name="causative" context="none" kana="あげさせる" />
                  <form name="tara" context="none" kana="あげたら" />
                  <form name="volitional" context="none" kana="あげよう" />
                  <form name="imperative" context="none" kana="あげろ" />
                </forms>
              </word>
              <word id="kaesu" translation="oddawać, zwracać" kana="かえす" kanji="返す" type="godan" ending="su">
                <usage>
                  <role ref="object" accepts="text vehicle thing" nouns="okane" />
                  <role ref="target" accepts="person animal" />
                  <role ref="location" />
                </usage>
                <forms>
                  <form name="dictionary" translation="oddaję" context="present" kana="かえす" />
                  <form name="polite_nonpast" translation="oddaję" context="present" kana="かえします" />
                  <form name="plain_negative" translation="nie oddaję" context="present" kana="かえさない" />
                  <form name="polite_negative" translation="nie oddaję" context="present" kana="かえしません" />
                  <form name="past_plain" translation="oddałem" context="past" kana="かえした" />
                  <form name="past_polite" translation="oddałem" context="past" kana="かえしました" />
                  <form name="past_negative_plain" translation="nie oddałem" context="past" kana="かえさなかった" />
                  <form name="past_negative_polite" translation="nie oddałem" context="past" kana="かえしませんでした" />
                  <form name="te_form" context="none" kana="かえして" />
                  <form name="potential" context="none" kana="かえせる" />
                  <form name="passive" context="none" kana="かえされる" />
                  <form name="causative" context="none" kana="かえさせる" />
                  <form name="tara" context="none" kana="かえしたら" />
                  <form name="volitional" context="none" kana="かえそう" />
                  <form name="imperative" context="none" kana="かえせ" />
                </forms>
              </word>
              <word id="kasu" translation="pożyczać komuś" kana="かす" kanji="貸す" type="godan" ending="su">
                <usage>
                  <role ref="object" accepts="text vehicle thing" nouns="okane" />
                  <role ref="target" accepts="person animal" />
                  <role ref="location" />
                </usage>
                <forms>
                  <form name="dictionary" translation="pożyczam komuś" context="present" kana="かす" />
                  <form name="polite_nonpast" translation="pożyczam komuś" context="present" kana="かします" />
                  <form name="plain_negative" translation="nie pożyczam komuś" context="present" kana="かさない" />
                  <form name="polite_negative" translation="nie pożyczam komuś" context="present" kana="かしません" />
                  <form name="past_plain" translation="pożyczyłem komuś" context="past" kana="かした" />
                  <form name="past_polite" translation="pożyczyłem komuś" context="past" kana="かしました" />
                  <form name="past_negative_plain" translation="nie pożyczyłem komuś" context="past" kana="かさなかった" />
                  <form name="past_negative_polite" translation="nie pożyczyłem komuś" context="past" kana="かしませんでした" />
                  <form name="te_form" context="none" kana="かして" />
                  <form name="potential" context="none" kana="かせる" />
                  <form name="passive" context="none" kana="かされる" />
                  <form name="causative" context="none" kana="かさせる" />
                  <form name="tara" context="none" kana="かしたら" />
                  <form name="volitional" context="none" kana="かそう" />
                  <form name="imperative" context="none" kana="かせ" />
                </forms>
              </word>
              <word id="kureru" translation="dawać mi, nam" kana="くれる" type="ichidan" ending="ru">
                <usage>
                  <role ref="object" accepts="food drink text media vehicle thing" nouns="okane" />
                  <role ref="target" accepts="person" />
                  <role ref="location" />
                </usage>
                <forms>
                  <form name="dictionary" translation="daje mi, nam" context="present" kana="くれる" />
                  <form name="polite_nonpast" translation="daje mi, nam" context="present" kana="くれます" />
                  <form name="plain_negative" translation="nie daje mi, nam" context="present" kana="くれない" />
                  <form name="polite_negative" translation="nie daje mi, nam" context="present" kana="くれません" />
                  <form name="past_plain" translation="dał mi, nam" context="past" kana="くれた" />
                  <form name="past_polite" translation="dał mi, nam" context="past" kana="くれました" />
                  <form name="past_negative_plain" translation="nie dał mi, nam" context="past" kana="くれなかった" />
                  <form name="past_negative_polite" translation="nie dał mi, nam" context="past" kana="くれませんでした" />
                  <form name="te_form" context="none" kana="くれて" />
                  <form name="potential" context="none" kana="くれられる" />
                  <form name="passive" context="none" kana="くれられる" />
                  <form name="causative" context="none" kana="くれさせる" />
                  <form name="tara" context="none" kana="くれたら" />
                  <form name="volitional" context="none" kana="くれよう" />
                  <form name="imperative" context="none" kana="くれ" />
                </forms>
              </word>
              <word id="morau" translation="otrzymywać" kana="もらう" type="godan" ending="u">
                <usage>
                  <role ref="object" accepts="food drink text media vehicle thing" nouns="okane" />
                  <role ref="target" accepts="person animal" />
                  <role ref="location" />
                </usage>
                <forms>
                  <form name="dictionary" translation="otrzymuję" context="present" kana="もらう" />
                  <form name="polite_nonpast" translation="otrzymuję" context="present" kana="もらいます" />
                  <form name="plain_negative" translation="nie otrzymuję" context="present" kana="もらわない" />
                  <form name="polite_negative" translation="nie otrzymuję" context="present" kana="もらいません" />
                  <form name="past_plain" translation="otrzymałem" context="past" kana="もらった" />
                  <form name="past_polite" translation="otrzymałem" context="past" kana="もらいました" />
                  <form name="past_negative_plain" translation="nie otrzymałem" context="past" kana="もらわなかった" />
                  <form name="past_negative_polite" translation="nie otrzymałem" context="past" kana="もらいませんでした" />
                  <form name="te_form" context="none" kana="もらって" />
                  <form name="potential" context="none" kana="もらえる" />
                  <form name="passive" context="none" kana="もらわれる" />
                  <form name="causative" context="none" kana="もらわせる" />
                  <form name="tara" context="none" kana="もらったら" />
                  <form name="volitional" context="none" kana="もらおう" />
                  <form name="imperative" context="none" kana="もらえ" />
                </forms>
              </word>
          '''.strip('\n')

          verbs_text = VERBS.read_text(encoding='utf-8')
          for word_id in ('ageru_give', 'kaesu', 'kasu', 'kureru', 'morau'):
              marker = f'<word id="{word_id}"'
              if marker in verbs_text:
                  raise SystemExit(f'{word_id} already exists in verbs.xml')
          closing = '  </words>\n</dictionary>'
          if closing not in verbs_text:
              raise SystemExit('verbs.xml closing marker not found')
          verbs_text = verbs_text.replace(closing, f'{new_words}\n{closing}', 1)
          VERBS.write_text(verbs_text, encoding='utf-8')

          thematic = r'''
              <lesson id="thematic_exchange" group="Tematyczne" main="Relacje i wymiana" name="Dawać, otrzymywać i pożyczać">
                <word id="thematic_verbs_ageru_give"><dictionary_ref dictionary="verbs" word="ageru_give" /></word>
                <word id="thematic_verbs_kureru"><dictionary_ref dictionary="verbs" word="kureru" /></word>
                <word id="thematic_verbs_morau"><dictionary_ref dictionary="verbs" word="morau" /></word>
                <word id="thematic_verbs_kasu"><dictionary_ref dictionary="verbs" word="kasu" /></word>
                <word id="thematic_verbs_kariru"><dictionary_ref dictionary="verbs" word="kariru" /></word>
                <word id="thematic_verbs_kaesu"><dictionary_ref dictionary="verbs" word="kaesu" /></word>
              </lesson>
              <lesson id="thematic_movement_change" group="Tematyczne" main="Ruch i zmiana" name="Wchodzić, wychodzić, wkładać i otwierać">
                <word id="thematic_verbs_hairu"><dictionary_ref dictionary="verbs" word="hairu" /></word>
                <word id="thematic_verbs_deru"><dictionary_ref dictionary="verbs" word="deru" /></word>
                <word id="thematic_verbs_ireru"><dictionary_ref dictionary="verbs" word="ireru" /></word>
                <word id="thematic_verbs_dasu"><dictionary_ref dictionary="verbs" word="dasu" /></word>
                <word id="thematic_verbs_akeru"><dictionary_ref dictionary="verbs" word="akeru" /></word>
                <word id="thematic_verbs_aku"><dictionary_ref dictionary="verbs" word="aku" /></word>
                <word id="thematic_verbs_shimeru"><dictionary_ref dictionary="verbs" word="shimeru" /></word>
                <word id="thematic_verbs_shimaru"><dictionary_ref dictionary="verbs" word="shimaru" /></word>
              </lesson>
              <lesson id="thematic_communication_learning" group="Tematyczne" main="Komunikacja i nauka" name="Mówić, słuchać, czytać i rozumieć">
                <word id="thematic_verbs_iu"><dictionary_ref dictionary="verbs" word="iu" /></word>
                <word id="thematic_verbs_hanasu"><dictionary_ref dictionary="verbs" word="hanasu" /></word>
                <word id="thematic_verbs_kiku"><dictionary_ref dictionary="verbs" word="kiku" /></word>
                <word id="thematic_verbs_yomu"><dictionary_ref dictionary="verbs" word="yomu" /></word>
                <word id="thematic_verbs_kaku"><dictionary_ref dictionary="verbs" word="kaku" /></word>
                <word id="thematic_verbs_miru"><dictionary_ref dictionary="verbs" word="miru" /></word>
                <word id="thematic_verbs_miseru"><dictionary_ref dictionary="verbs" word="miseru" /></word>
                <word id="thematic_verbs_oshieru"><dictionary_ref dictionary="verbs" word="oshieru" /></word>
                <word id="thematic_verbs_wakaru"><dictionary_ref dictionary="verbs" word="wakaru" /></word>
                <word id="thematic_verbs_kangaeru"><dictionary_ref dictionary="verbs" word="kangaeru" /></word>
              </lesson>
              <lesson id="thematic_daily_actions" group="Tematyczne" main="Codzienne czynności" name="Ruch, jedzenie i zakupy">
                <word id="thematic_verbs_iku"><dictionary_ref dictionary="verbs" word="iku" /></word>
                <word id="thematic_verbs_kuru"><dictionary_ref dictionary="verbs" word="kuru" /></word>
                <word id="thematic_verbs_kaeru"><dictionary_ref dictionary="verbs" word="kaeru" /></word>
                <word id="thematic_verbs_aruku"><dictionary_ref dictionary="verbs" word="aruku" /></word>
                <word id="thematic_verbs_taberu"><dictionary_ref dictionary="verbs" word="taberu" /></word>
                <word id="thematic_verbs_nomu"><dictionary_ref dictionary="verbs" word="nomu" /></word>
                <word id="thematic_verbs_kau"><dictionary_ref dictionary="verbs" word="kau" /></word>
                <word id="thematic_verbs_tsukuru"><dictionary_ref dictionary="verbs" word="tsukuru" /></word>
              </lesson>
              <lesson id="thematic_adjective_contrasts" group="Tematyczne" main="Przeciwieństwa" name="Rozmiar, wiek, cena i temperatura">
                <word id="thematic_adjectives_ookii"><dictionary_ref dictionary="adjectives" word="ookii" /></word>
                <word id="thematic_adjectives_chiisai"><dictionary_ref dictionary="adjectives" word="chiisai" /></word>
                <word id="thematic_adjectives_atarashii"><dictionary_ref dictionary="adjectives" word="atarashii" /></word>
                <word id="thematic_adjectives_furui"><dictionary_ref dictionary="adjectives" word="furui" /></word>
                <word id="thematic_adjectives_takai"><dictionary_ref dictionary="adjectives" word="takai" /></word>
                <word id="thematic_adjectives_yasui"><dictionary_ref dictionary="adjectives" word="yasui" /></word>
                <word id="thematic_adjectives_atsui"><dictionary_ref dictionary="adjectives" word="atsui" /></word>
                <word id="thematic_adjectives_samui"><dictionary_ref dictionary="adjectives" word="samui" /></word>
              </lesson>
              <lesson id="thematic_food_drink" group="Tematyczne" main="Rzeczy wokół nas" name="Jedzenie i napoje">
                <word id="thematic_nouns_meal"><dictionary_ref dictionary="nouns" word="meal" /></word>
                <word id="thematic_nouns_gohan"><dictionary_ref dictionary="nouns" word="gohan" /></word>
                <word id="thematic_nouns_pan"><dictionary_ref dictionary="nouns" word="pan" /></word>
                <word id="thematic_nouns_sushi"><dictionary_ref dictionary="nouns" word="sushi" /></word>
                <word id="thematic_nouns_ringo"><dictionary_ref dictionary="nouns" word="ringo" /></word>
                <word id="thematic_nouns_coffee"><dictionary_ref dictionary="nouns" word="coffee" /></word>
                <word id="thematic_nouns_tea"><dictionary_ref dictionary="nouns" word="tea" /></word>
                <word id="thematic_nouns_water"><dictionary_ref dictionary="nouns" word="water" /></word>
              </lesson>
              <lesson id="thematic_reading_messages" group="Tematyczne" main="Rzeczy wokół nas" name="Książki i wiadomości">
                <word id="thematic_nouns_book"><dictionary_ref dictionary="nouns" word="book" /></word>
                <word id="thematic_nouns_newspaper"><dictionary_ref dictionary="nouns" word="newspaper" /></word>
                <word id="thematic_nouns_manga"><dictionary_ref dictionary="nouns" word="manga" /></word>
                <word id="thematic_nouns_letter"><dictionary_ref dictionary="nouns" word="letter" /></word>
                <word id="thematic_nouns_email"><dictionary_ref dictionary="nouns" word="email" /></word>
                <word id="thematic_nouns_note"><dictionary_ref dictionary="nouns" word="note" /></word>
              </lesson>
          '''.strip('\n')

          lessons_text = LESSONS.read_text(encoding='utf-8')
          start = lessons_text.find('    <lesson id="thematic_')
          end_marker = '  </lessons>\n</lesson_catalog>'
          end = lessons_text.find(end_marker)
          if start < 0 or end < 0 or start >= end:
              raise SystemExit('Existing thematic lesson section not found')
          lessons_text = lessons_text[:start] + thematic + '\n' + lessons_text[end:]
          LESSONS.write_text(lessons_text, encoding='utf-8')

          # Validate every thematic dictionary_ref against the canonical dictionary files.
          project = ET.parse('quiz_project.xml').getroot()
          dictionary_files = {
              item.get('id'): item.get('file')
              for item in project.findall('./dictionaries/dictionary')
          }
          dictionary_ids: dict[str, set[str]] = {}
          for dictionary_id, filename in dictionary_files.items():
              root = ET.parse(filename).getroot()
              dictionary_ids[dictionary_id] = {
                  word.get('id') for word in root.findall('./words/word') if word.get('id')
              }

          lesson_root = ET.parse(LESSONS).getroot()
          for lesson in lesson_root.findall('./lessons/lesson'):
              if lesson.get('group') != 'Tematyczne':
                  continue
              refs = lesson.findall('./word/dictionary_ref')
              if len(refs) < 6:
                  raise SystemExit(f"Thematic lesson {lesson.get('id')} has fewer than 6 words")
              for ref in refs:
                  dictionary_id = ref.get('dictionary') or ''
                  word_id = ref.get('word') or ''
                  if word_id not in dictionary_ids.get(dictionary_id, set()):
                      raise SystemExit(
                          f"Missing dictionary target {dictionary_id}:{word_id} "
                          f"in lesson {lesson.get('id')}"
                      )
              if lesson.findall('./local_word'):
                  raise SystemExit(f"Thematic lesson {lesson.get('id')} contains local_word")

          revision = json.loads(REVISION.read_text(encoding='utf-8'))['revision']
          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          manifest['revision'] = revision
          for entry in manifest['files']:
              path = entry['path']
              if not path.startswith('data/'):
                  continue
              source = Path(path.removeprefix('data/'))
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              entry['sha256'] = digest
              base_url = entry['url'].split('?', 1)[0]
              entry['url'] = f'{base_url}?kotomi_sha256={digest}'
          MANIFEST.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate repository
        run: python tools/validate_repository.py

      - name: Commit generated lesson data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionaries/verbs.xml lessons/lessons.xml database_update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refine thematic vocabulary lessons"
          git push origin HEAD:feature/thematic-vocabulary-lessons
