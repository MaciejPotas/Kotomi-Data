name: Publish split Verbs package

on:
  push:
    branches:
      - feature/verbs-logic-separation
    paths:
      - tools/apply_verbs_public_split.py

permissions:
  contents: write

concurrency:
  group: verbs-public-split
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out exact public feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/verbs-logic-separation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Publish split Verbs package
        run: python tools/apply_verbs_public_split.py

      - name: Validate package and manifest
        shell: pwsh
        run: |
          python -m py_compile quizzes/verbs/Kotomi_verbs.py quizzes/verbs/logic.py quizzes/verbs/mobile.py
          python -m json.tool quiz_update_manifest.json > $null
          git diff --cached --check

      - name: Commit public package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish split Verbs quiz package"
          git push origin HEAD:feature/verbs-logic-separation
