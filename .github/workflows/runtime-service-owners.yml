name: Runtime service owner imports

on:
  push:
    branches:
      - kotomi-package-hierarchy
    paths:
      - .github/workflows/runtime-service-owners.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare runtime service owner imports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Update published service imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()
          replacements = {
              'from kotomi.core.quiz import LessonSentenceQuiz': 'from kotomi.runtime.lesson_sentence_quiz import LessonSentenceQuiz',
              'from kotomi.core.quiz import (\n    LessonSentenceQuiz,\n)': 'from kotomi.runtime.lesson_sentence_quiz import LessonSentenceQuiz',
              'from kotomi.core.dictionary import DictionaryService': 'from kotomi.runtime.dictionary_service import DictionaryService',
          }
          for path in sorted((root / 'quizzes').rglob('*.py')):
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          manifest_path = root / 'quiz_update_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['files']:
              if not item['path'].startswith('apps/'):
                  continue
              rel = item['path'][len('apps/'):]
              source = root / 'quizzes' / rel
              if source.is_file():
                  digest = hashlib.sha256(source.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')).hexdigest()
                  item['sha256'] = digest
                  item['url'] = f'quizzes/{rel}?kotomi_sha256={digest}'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
          python -m compileall -q quizzes
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quizzes quiz_update_manifest.json
          if git diff --cached --quiet; then
            echo 'No public service imports needed migration.'
          else
            git commit -m 'Use runtime owners for cross-layer services'
            git push
          fi
