name: Lesson runtime owner update

on:
  push:
    branches:
      - kotomi-package-hierarchy
    paths:
      - .github/workflows/lesson-runtime-owner.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Prepare lesson runtime owner update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Move lesson synchronization import to runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()
          logic = root / 'quizzes/lessons/logic.py'
          text = logic.read_text(encoding='utf-8')
          old = 'from kotomi.core.lessons.grammar import synchronize_catalog'
          new = 'from kotomi.runtime.lesson_catalog_sync import synchronize_catalog'
          assert old in text
          logic.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          manifest_path = root / 'quiz_update_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256(logic.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')).hexdigest()
          target = 'apps/lessons/logic.py'
          found = False
          for item in manifest['files']:
              if item['path'] == target:
                  item['sha256'] = digest
                  item['url'] = f'quizzes/lessons/logic.py?kotomi_sha256={digest}'
                  found = True
                  break
          assert found
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
          python -m py_compile quizzes/lessons/logic.py
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quizzes/lessons/logic.py quiz_update_manifest.json
          git commit -m 'Move lesson synchronization to runtime owner'
          git push
