name: Prepare source-role Content update test

on:
  push:
    branches:
      - test/content-update-role-source

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply linked Content changes
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          grammar_path = root / "grammar" / "grammar_rules.xml"
          grammar = grammar_path.read_text(encoding="utf-8")
          reaction = '    <role id="reaction_target" label="Reaction target" particle="に" />\n'
          source = '    <role id="source" label="Source" particle="から" accepts="place" />\n'
          if source not in grammar:
              if reaction not in grammar:
                  raise SystemExit("reaction_target role anchor not found")
              grammar = grammar.replace(reaction, reaction + source, 1)
              grammar_path.write_text(grammar, encoding="utf-8")

          verbs_path = root / "dictionaries" / "verbs.xml"
          verbs = verbs_path.read_text(encoding="utf-8")
          word_start = verbs.index('    <word id="aruku"')
          word_end = verbs.index("    </word>", word_start) + len("    </word>")
          aruku = verbs[word_start:word_end]
          source_usage = '        <role ref="source" />\n'
          if source_usage not in aruku:
              location_usage = '        <role ref="location" />\n'
              if location_usage not in aruku:
                  raise SystemExit("aruku location role anchor not found")
              aruku = aruku.replace(location_usage, location_usage + source_usage, 1)
              verbs = verbs[:word_start] + aruku + verbs[word_end:]
              verbs_path.write_text(verbs, encoding="utf-8")

          patterns_path = root / "patterns" / "sentence_maps.xml"
          patterns = patterns_path.read_text(encoding="utf-8")
          source_pattern = '''    <sentence_pattern id="source" label="Punkt wyjścia">
              <question>{context.translation}{verb[role:source][form].translation} z {noun[category:place][case:genitive]}.</question>
              <answer>{context.kana}{noun[category:place]}から{verb[role:source][form]}</answer>
            </sentence_pattern>
          '''
          if 'id="source" label="Punkt wyjścia"' not in patterns:
              companion_anchor = '    <sentence_pattern id="companion" label="Towarzysz">\n'
              if companion_anchor not in patterns:
                  raise SystemExit("companion pattern anchor not found")
              patterns = patterns.replace(companion_anchor, source_pattern + companion_anchor, 1)
              patterns_path.write_text(patterns, encoding="utf-8")

          revision_path = root / "content_revision.json"
          revision_data = json.loads(revision_path.read_text(encoding="utf-8"))
          revision_data["revision"] = 6
          revision_path.write_text(
              json.dumps(revision_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          manifest_path = root / "content_update_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["revision"] = 6
          for entry in manifest["files"]:
              published_path = entry["path"]
              if not published_path.startswith("data/"):
                  raise SystemExit(f"unexpected Content path: {published_path}")
              relative = published_path[len("data/"):]
              local_path = root / relative
              digest = hashlib.sha256(local_path.read_bytes()).hexdigest()
              entry["sha256"] = digest
              entry["url"] = f"{relative}?kotomi_sha256={digest}"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate repository
        run: python3 tools/validate_repository.py

      - name: Remove temporary workflow
        run: rm .github/workflows/prepare-content-update-role-source.yml

      - name: Commit prepared Content revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add source-role Content update test"
          git push origin HEAD:test/content-update-role-source
