name: Runtime facade import audit

on:
  push:
    branches:
      - kotomi-package-hierarchy
    paths:
      - .github/workflows/runtime-facades.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare runtime facade import audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Migrate cross-layer facade imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()
          replacements = {
              'from kotomi.core.generation import SharedQuizEngine': 'from kotomi.runtime.generation_engine import SharedQuizEngine',
              'from kotomi.core.generation.engine import SharedQuizEngine': 'from kotomi.runtime.generation_engine import SharedQuizEngine',
              'kotomi.core.authoring': 'kotomi.runtime.authoring',
              'from kotomi.core.lessons.grammar import synchronize_catalog': 'from kotomi.runtime.lesson_catalog_sync import synchronize_catalog',
          }
          changed = set()
          for path in sorted((root / 'quizzes').rglob('*.py')):
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed.add(path)

          manifest_path = root / 'quiz_update_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['files']:
              if not item['path'].startswith('apps/'):
                  continue
              rel = item['path'][len('apps/'):]
              source = root / 'quizzes' / rel
              if not source.is_file():
                  continue
              digest = hashlib.sha256(source.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')).hexdigest()
              item['sha256'] = digest
              item['url'] = f'quizzes/{rel}?kotomi_sha256={digest}'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY
          python -m compileall -q quizzes
          git diff --check
      - name: Commit audit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quizzes quiz_update_manifest.json
          if git diff --cached --quiet; then
            echo 'No facade imports needed migration.'
          else
            git commit -m 'Use runtime owners for cross-layer facades'
            git push
          fi
