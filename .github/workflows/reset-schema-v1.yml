name: Reset project schema to 1

on:
  push:
    branches:
      - reset-schema-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset schema and refresh Database manifest
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          changed = []
          for path in sorted(Path('.').glob('*.xml')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('schema_version="13"', 'schema_version="1"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          manifest_path = Path('database_update_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for entry in manifest['files']:
              relative = entry['path']
              if not relative.startswith('data/'):
                  raise SystemExit(f"Unexpected Database path: {relative}")
              local_path = Path(relative.removeprefix('data/'))
              digest = hashlib.sha256(local_path.read_bytes()).hexdigest()
              base_url = entry['url'].split('?', 1)[0]
              entry['sha256'] = digest
              entry['url'] = f"{base_url}?kotomi_sha256={digest}"

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          if not changed:
              raise SystemExit('No Schema 13 XML files were found to migrate.')

          print('Migrated:')
          for path in changed:
              print(f'  {path}')
          PY

      - name: Verify Schema 1 baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          failures = []
          for path in sorted(Path('.').glob('*.xml')):
              text = path.read_text(encoding='utf-8')
              if 'schema_version="13"' in text:
                  failures.append(path.as_posix())
          if failures:
              raise SystemExit('Schema 13 remains in: ' + ', '.join(failures))
          PY

      - name: Commit migrated data
        shell: bash
        run: |
          rm -f .github/workflows/reset-schema-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Reset Kotomi data schema to 1"
          git push origin HEAD:reset-schema-v1
