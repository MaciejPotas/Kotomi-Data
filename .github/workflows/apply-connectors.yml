name: Apply connector data patch
on:
  push:
    branches:
      - feature/japanese-connectors
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap connector data patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/japanese-connectors
      - name: Apply prepared patch
        env:
          PATCH_GZ_B64: >-
            
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/connectors.patch
          git apply /tmp/connectors.patch
          rm .github/workflows/apply-connectors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Japanese connector vocabulary and quizzes'
          git push origin HEAD:feature/japanese-connectors
