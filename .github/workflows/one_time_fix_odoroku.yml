name: One-time odoroku Polish causative fix

on:
  push:
    branches:
      - feature/fix-odoroku-polish-causative

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out data branch
        uses: actions/checkout@v6
        with:
          ref: feature/fix-odoroku-polish-causative

      - name: Correct odoroku and refresh database metadata
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          verbs_path = Path("dictionaries/verbs.xml")
          text = verbs_path.read_text(encoding="utf-8")
          marker = '<word id="odoroku_驚く"'
          start = text.index(marker)
          end = text.index("</word>", start)
          block = text[start:end]
          old = '<form name="causative" translation="każę" context="none" kana="おどろかせる" kanji="驚かせる" romaji="odorokaseru" />'
          new = '<form name="causative" translation="zaskakiwać kogoś" context="none" kana="おどろかせる" kanji="驚かせる" romaji="odorokaseru" />'
          if block.count(old) != 1:
              raise RuntimeError("Expected exactly one legacy odoroku causative form")
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          verbs_path.write_text(text, encoding="utf-8", newline="\n")

          revision_path = Path("database_revision.json")
          revision_data = json.loads(revision_path.read_text(encoding="utf-8"))
          revision_data["revision"] = int(revision_data["revision"]) + 1
          revision_path.write_text(
              json.dumps(revision_data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          def digest(path: Path) -> str:
              data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              return hashlib.sha256(data).hexdigest()

          manifest_path = Path("database_update_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["revision"] = revision_data["revision"]
          changed = {
              "data/dictionaries/verbs.xml": verbs_path,
              "data/database_revision.json": revision_path,
          }
          for entry in manifest["files"]:
              source = changed.get(entry["path"])
              if source is None:
                  continue
              sha256 = digest(source)
              entry["sha256"] = sha256
              entry["url"] = entry["url"].split("?", 1)[0] + f"?kotomi_sha256={sha256}"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          Path(".github/workflows/one_time_fix_odoroku.yml").unlink()

      - name: Commit corrected data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionaries/verbs.xml database_revision.json database_update_manifest.json .github/workflows/one_time_fix_odoroku.yml
          git commit -m "Fix Polish causative for odoroku"
          git push origin HEAD:feature/fix-odoroku-polish-causative
