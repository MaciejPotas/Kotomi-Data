name: Run quiz platform import migration

on:
  push:
    branches: [platform-application-imports]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run quiz platform import migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform-application-imports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Migrate imports and manifest hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          replacements = (
              ('kotomi.runtime.', 'kotomi.application.'),
              ('kotomi.runtime', 'kotomi.application'),
              ('kotomi.mobile.', 'platforms.mobile.'),
              ('kotomi.mobile', 'platforms.mobile'),
              ('kotomi.ui.translations', 'kotomi.application.translations'),
              ('kotomi.ui.identity', 'platforms.mobile.identity'),
          )
          for path in sorted((root / 'quizzes').rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              for source, target in replacements:
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8', newline='\n')

          manifest_path = root / 'quiz_update_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['files']:
              parts = Path(item['path']).parts
              source = root / 'quizzes' / Path(*parts[1:])
              payload = source.read_bytes().replace(b'\r\n', b'\n')
              digest = hashlib.sha256(payload).hexdigest()
              item['sha256'] = digest
              item['url'] = f"quizzes/{Path(*parts[1:]).as_posix()}?kotomi_sha256={digest}"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          for path in sorted((root / 'quizzes').rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              for stale in ('kotomi.runtime', 'kotomi.mobile', 'kotomi.ui'):
                  if stale in text:
                      raise RuntimeError(f'Stale import {stale} in {path}')
          PY
          python -m compileall -q quizzes
          git add quizzes quiz_update_manifest.json
          git diff --cached --check
          git commit -m 'Align quiz packages with platform architecture'
          git push origin HEAD:platform-application-imports
