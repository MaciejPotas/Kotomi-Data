name: Kotomi-Data validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotomi-data-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Data and package contracts / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Kotomi-Data
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate learning data and public quiz packages
        run: python tools/validate_repository.py
