name: Canonicalize quiz package imports

on:
  push:
    branches:
      - refactor/canonical-app-imports
    paths:
      - .github/workflows/canonicalize_app_imports.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Canonicalize imports and refresh quiz manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json

          replacements = {
              Path("quizzes/lessons/logic.py"): (
                  ("from kotomi_core.basic_quiz import (", "from kotomi_core.quiz import ("),
                  ("from kotomi_core.conjugation_quiz import (", "from kotomi_core.quiz import ("),
                  ("from kotomi_core.grammar_bridge import synchronize_catalog", "from kotomi_core.lessons.grammar import synchronize_catalog"),
                  ("from kotomi_core.questions import Question, QuizSession", "from kotomi_core.quiz import Question, QuizSession"),
                  ("from kotomi_core.sentence_quiz import LessonSentenceQuiz", "from kotomi_core.quiz import LessonSentenceQuiz"),
              ),
              Path("quizzes/lessons/mobile.py"): (
                  ("from kotomi_core.app_identity import (", "from kotomi_ui.identity import ("),
                  ("from kotomi_core.mobile_i18n import mobile_error_text, mobile_text", "from kotomi_ui.mobile_i18n import mobile_error_text, mobile_text"),
              ),
              Path("quizzes/verbs/mobile.py"): (
                  ("from kotomi_core.app_identity import (", "from kotomi_ui.identity import ("),
                  ("from kotomi_core.mobile_i18n import mobile_error_text, mobile_text", "from kotomi_ui.mobile_i18n import mobile_error_text, mobile_text"),
              ),
              Path("quizzes/adjectives/mobile.py"): (
                  ("from kotomi_core.app_identity import (", "from kotomi_ui.identity import ("),
                  ("from kotomi_core.mobile_i18n import mobile_error_text, mobile_text", "from kotomi_ui.mobile_i18n import mobile_error_text, mobile_text"),
              ),
              Path("quizzes/availability/mobile.py"): (
                  ("from kotomi_core.app_identity import (", "from kotomi_ui.identity import ("),
                  ("from kotomi_core.mobile_i18n import mobile_error_text, mobile_text", "from kotomi_ui.mobile_i18n import mobile_error_text, mobile_text"),
              ),
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in source:
                      raise SystemExit(f"Missing expected import in {path}: {old}")
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8", newline="\n")

          manifest_path = Path("quiz_update_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for entry in manifest["files"]:
              install_path = entry["path"]
              if not install_path.startswith("apps/"):
                  continue
              relative = install_path.removeprefix("apps/")
              source_path = Path("quizzes") / relative
              data = source_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              digest = hashlib.sha256(data).hexdigest()
              base_url = entry["url"].split("?", 1)[0]
              entry["sha256"] = digest
              entry["url"] = f"{base_url}?kotomi_sha256={digest}"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          forbidden = (
              "kotomi_core.basic_quiz",
              "kotomi_core.conjugation_quiz",
              "kotomi_core.questions",
              "kotomi_core.grammar_bridge",
              "kotomi_core.sentence_quiz",
              "kotomi_core.app_identity",
              "kotomi_core.mobile_i18n",
          )
          for path in Path("quizzes").glob("*/*.py"):
              source = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in source:
                      raise SystemExit(f"Legacy owner import remains in {path}: {token}")
      - name: Commit public package imports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quizzes quiz_update_manifest.json
          git diff --cached --check
          git commit -m "Use canonical Kotomi package imports"
          git push origin HEAD:refactor/canonical-app-imports
