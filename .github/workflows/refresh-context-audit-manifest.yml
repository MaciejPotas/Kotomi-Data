name: Refresh context audit manifest

on:
  push:
    branches:
      - fix/generative-question-patterns
    paths:
      - .github/workflows/refresh-context-audit-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/generative-question-patterns

      - name: Refresh changed content hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          def digest(path: Path) -> str:
              data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              return hashlib.sha256(data).hexdigest()

          manifest_path = Path("content_update_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          revision = json.loads(Path("content_revision.json").read_text(encoding="utf-8"))["revision"]
          manifest["revision"] = revision
          changed = {
              "data/content_revision.json": Path("content_revision.json"),
              "data/patterns/sentence_maps.xml": Path("patterns/sentence_maps.xml"),
          }
          for item in manifest["files"]:
              path = item["path"]
              if path not in changed:
                  continue
              value = digest(changed[path])
              item["sha256"] = value
              remote = item["url"].split("?", 1)[0]
              item["url"] = f"{remote}?kotomi_sha256={value}"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

      - name: Commit generated manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_update_manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh context audit content manifest"
          git push origin HEAD:fix/generative-question-patterns
