name: Refresh context audit manifest

on:
  push:
    branches:
      - fix/generative-question-patterns
    paths:
      - .github/workflows/refresh-context-audit-manifest.yml

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/generative-question-patterns

      - name: Print changed content hashes
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          def digest(path: Path) -> str:
              data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              return hashlib.sha256(data).hexdigest()

          for path in (Path("content_revision.json"), Path("patterns/sentence_maps.xml")):
              print(f"HASH {path.as_posix()} {digest(path)}")
