name: Publish split Grammar package

on:
  push:
    branches:
      - feature/grammar-logic-separation
    paths:
      - .github/apply-grammar-public-split.trigger

permissions:
  contents: write

concurrency:
  group: grammar-public-split
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out exact public feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/grammar-logic-separation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply guarded public Grammar split
        run: python tools/apply_grammar_public_split.py

      - name: Validate package and manifest
        shell: pwsh
        run: |
          python -m py_compile quizzes/grammar/Kotomi_grammar.py quizzes/grammar/logic.py quizzes/grammar/mobile.py
          python -m json.tool quiz_update_manifest.json > $null
          git diff --cached --check

      - name: Commit split public Grammar package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish split Grammar quiz package"
          git push origin HEAD:feature/grammar-logic-separation
